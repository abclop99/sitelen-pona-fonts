name: Build fonts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r build/requirements.txt
      - run: python build/build.py --font combos
      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: dist/
