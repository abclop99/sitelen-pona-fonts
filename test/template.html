<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font Test Page</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1f1d1a; --muted: #8a857c; --line: #e4e0d8;
    --card: #ffffff; --accent: #2f6f9f; --cell: rgba(47, 111, 159, .12); --draft: #8e7cc3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a18; --fg: #ece8e1; --muted: #8f8a82; --line: #34322e;
      --card: #24231f; --accent: #7fb3d9; --cell: rgba(127, 179, 217, .14); --draft: #a998dc;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a18; --fg: #ece8e1; --muted: #8f8a82; --line: #34322e;
    --card: #24231f; --accent: #7fb3d9; --cell: rgba(127, 179, 217, .14); --draft: #a998dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 32px 0 10px; color: var(--muted); font-weight: 600;
       text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
              padding: 12px 0; border-bottom: 1px solid var(--line); }
  .controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  textarea { width: 100%; min-height: 70px; font: inherit; padding: 10px; border-radius: 6px;
             border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .sample { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
            padding: 16px; margin: 10px 0; overflow-wrap: anywhere; }
  .sample .tag { font: 12px system-ui, sans-serif; color: var(--muted); margin-bottom: 6px; }
  .sp { line-height: 1.5; }
  .sp .missing { font: .3em system-ui, sans-serif; color: var(--muted); vertical-align: middle;
                 border: 1px dashed var(--muted); border-radius: 3px; padding: 0 .3em; }
  .show-cells .sp .g { background: var(--cell); box-shadow: inset 0 0 0 1px var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .cell { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
          padding: 6px; text-align: center; }
  .cell .glyphs { display: flex; justify-content: center; gap: 6px; font-size: 40px; line-height: 1.3; }
  .cell .glyphs span { background: var(--cell); }
  .cell.todo { opacity: .45; }
  .cell .name { font-size: 12px; color: var(--muted); }
  .cell.draft { border-style: dashed; }
  .cell.draft .name::after { content: " · draft"; }
  .show-drafts .sp .d, .show-drafts .cell.draft .glyphs span { color: var(--draft); }
  .key { color: var(--draft); font-weight: 600; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 0; }
  .progress div { height: 100%; background: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title">Font test page</h1>
  <p class="sub" id="status"></p>

  <div class="controls">
    <label>Size <input type="range" id="size" min="16" max="160" value="56"></label>
    <label><input type="checkbox" id="cells"> Show glyph boxes</label>
    <label><input type="checkbox" id="drafts" checked> Colour drafts</label>
  </div>

  <h2>Text</h2>
  <textarea id="input" spellcheck="false">toki pona li pona. mi wile sitelen e nimi ale. tomo tawa li tawa lon ma. ala ala ala. tu li ike ala.</textarea>
  <div id="samples"></div>

  <h2>All words</h2>
  <p class="sub">Each cell shows the monospace build on the left and the proportional build on the right. Dashed cells, in <span class="key">purple</span>, still use the geometric draft; faded cells have nothing yet.</p>
  <div class="grid" id="grid"></div>
</main>

<script>
const DATA = /*DATA*/null;

const style = document.createElement("style");
style.textContent = Object.entries(DATA.fonts).map(([mode, b64]) =>
  `@font-face { font-family: "test-${mode}"; src: url(data:font/woff2;base64,${b64}) format("woff2"); }
   .f-${mode} { font-family: "test-${mode}", system-ui; }`).join("\n");
document.head.appendChild(style);

const byWord = new Map();
for (const w of DATA.words) {
  byWord.set(w.word, w);
  for (const a of w.aliases) byWord.set(a, w);
}
const drawn = DATA.words.filter(w => w.drawn && !w.draft).length;
const drafts = DATA.words.filter(w => w.draft).length;
document.getElementById("title").textContent = DATA.family;
document.getElementById("status").innerHTML =
  `${drawn} of ${DATA.words.length} words drawn` +
  (drafts ? `, <span class="key">${drafts} still drafts</span>` : "") + ` &middot; built ${DATA.built}` +
  `<div class="progress"><div style="width:${100 * drawn / DATA.words.length}%"></div></div>`;

function render(text, mode) {
  const out = document.createElement("div");
  out.className = `sp f-${mode}`;
  for (const token of text.split(/([a-zA-Z]+|\s+)/)) {
    if (!token) continue;
    const w = byWord.get(token.toLowerCase());
    if (w && w.drawn) {
      const s = document.createElement("span");
      s.className = w.draft ? "g d" : "g";
      s.textContent = String.fromCodePoint(w.cp);
      out.appendChild(s);
    } else if (/^[a-zA-Z]+$/.test(token)) {
      const s = document.createElement("span");
      s.className = "missing";
      s.textContent = token;
      out.appendChild(s);
    } else if (/\s/.test(token)) {
      // a single space just separates words; each pair of spaces makes one blank, as in sitelen seli kiwen
      const blanks = Math.floor((token.match(/ /g) || []).length / 2);
      if (blanks) out.appendChild(document.createTextNode("\u3000".repeat(blanks)));
    } else {
      out.appendChild(document.createTextNode(token.replace(/\./g, "　")));
    }
  }
  return out;
}

function update() {
  const text = document.getElementById("input").value;
  const box = document.getElementById("samples");
  box.innerHTML = "";
  for (const [mode, label] of [["mono", "Monospace"], ["prop", "Proportional"]]) {
    const card = document.createElement("div");
    card.className = "sample";
    card.innerHTML = `<div class="tag">${label}</div>`;
    card.appendChild(render(text, mode));
    box.appendChild(card);
  }
  document.querySelectorAll(".sp").forEach(e => e.style.fontSize = document.getElementById("size").value + "px");
}

const grid = document.getElementById("grid");
for (const w of DATA.words) {
  const c = document.createElement("div");
  c.className = "cell" + (w.draft ? " draft" : w.drawn ? "" : " todo");
  const ch = String.fromCodePoint(w.cp);
  c.innerHTML = `<div class="glyphs">${w.drawn
      ? `<span class="f-mono">${ch}</span><span class="f-prop">${ch}</span>`
      : "&nbsp;"}</div><div class="name">${w.word}</div>`;
  grid.appendChild(c);
}

document.getElementById("input").addEventListener("input", update);
document.getElementById("size").addEventListener("input", update);
document.getElementById("cells").addEventListener("change", e =>
  document.body.classList.toggle("show-cells", e.target.checked));
document.getElementById("drafts").addEventListener("change", e =>
  document.body.classList.toggle("show-drafts", e.target.checked));
document.body.classList.add("show-drafts");
update();
</script>
</body>
</html>
