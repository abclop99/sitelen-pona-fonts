# sitelen pona, standard font, as a pfe project: the source of the font. Imported once from the
# earlier Inkscape drawings (kept on the claude/project-thread-y55klr branch).

pfe = "0.4"

[font]
family = "SP Standard Draft"   # temporary, until the font has a name
upm = 1000
version = "0.1"
copyright = "Copyright (c) 2026 abclop99. Some glyphs based on sitelen seli kiwen, Copyright (c) 2022 Kreative Software."
designer = "abclop99"
license = "This Font Software is licensed under the SIL Open Font License, Version 1.1."
license_url = "https://openfontlicense.org"
description = "sitelen pona, the writing system of Toki Pona. Glyph forms follow jan Sonja's (Sonja Lang's) handwriting in Toki Pona: The Language of Good (pu), traced and adjusted from CC0 vectorizations on Wikimedia Commons by LiliCharlie and Sonja Lang. Some ku suli glyphs, which have no drawing in pu, are traced from sitelen seli kiwen (Kreative Software, SIL OFL 1.1)."

[params]
stroke = 50         # centreline pen width
subdiv = 4          # cubics per stroke side per segment; imported curves bend sharply
margin_l = 50       # space before the ink box
margin_r = 50       # space after it
box_w = 800         # the ink box's width
box_h = 800         # and height
box_b = 0           # its bottom edge

# The word list, for each glyph's code and class (glyph_defaults() in font.rhai).
[data]
words = { path = "../../../spec/words.tsv", header = "last_comment" }

[preview]
proof = "sp.toki sp.pona sp.li sp.pona"
reference = "reference"
